[project]
name = "linkforge"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.pyright]
typeCheckingMode = "strict"
